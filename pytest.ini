[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=./reports/allure-results
    --clean-alluredir
    -p no:cacheprovider
markers =
    smoke: smoke tests
    regression: regression tests
    critical: critical-path tests
    slow: slow tests
    no_auth_state: run without a saved Playwright login state
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
